            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/orders"
