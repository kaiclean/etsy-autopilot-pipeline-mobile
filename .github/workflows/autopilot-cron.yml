# Scheduled stage runs for the Railway deployment.
# GitHub only runs `schedule` from the default branch.
# After merge, set repository secrets once:
#   CRON_SECRET     same value as Railway CRON_SECRET (required)
#   AUTOPILOT_URL   optional; defaults to the production Railway URL below
# This file never contains secret values. Schedules do not change dry-run publishing.

name: Autopilot cron

on:
  schedule:
    - cron: "*/5 * * * *" # durable job recovery
    - cron: "0 3 * * *" # analytics
    - cron: "17 4 * * *" # maintenance
    - cron: "40 4 * * *" # hot signals, before research
    - cron: "20 5 * * *" # daily chain: research, design brief, listing draft
    - cron: "0 5 * * 1" # research, Monday
    - cron: "0 6 * * *" # design
    - cron: "30 6 * * *" # listing
    - cron: "0 7 * * *" # publish
    - cron: "0 8 * * *" # orders
    - cron: "0 9 * * 1" # health report, Monday
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage to run now
        required: true
        type: choice
        options:
          - analytics
          - maintenance
          - hot
          - daily
          - research
          - design
          - listing
          - publish
          - orders
          - health
      force:
        description: Pass force=1 so the daily chain runs again after a success today
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  recovery:
    if: ${{ github.event.schedule == '*/5 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recover durable jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "${url%/}/api/cron/jobs"
  hot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'hot' || github.event.schedule == '40 4 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run hot signal scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          curl -fsS --connect-timeout 15 --max-time 300 -H "$(printf 'Authorization: %s %s' 'Bearer' "${CRON_SECRET}")" "${url}/api/cron/hot"

  analytics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'analytics' || github.event.schedule == '0 3 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run analytics
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/analytics${query}"

  research:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'research' || github.event.schedule == '0 5 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run research
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/research${query}"

  design:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'design' || github.event.schedule == '0 6 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run design
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/design${query}"

  listing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'listing' || github.event.schedule == '30 6 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run listing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/listing${query}"

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'publish' || github.event.schedule == '0 7 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run publish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/publish${query}"

  orders:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'orders' || github.event.schedule == '0 8 * * *' }}
    runs-on: ubuntu-latest
    steps:
      # curl -f accepts HTTP 202; stage outcomes are tracked in the activity log.
      - name: Start orders sync (HTTP 202 accepted)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          response=$(curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/orders${query}")
          echo "$response"
          job=$(printf '%s' "$response" | jq -r '.jobId // empty')
          test -n "$job"
          for attempt in $(seq 1 30); do
            state=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/jobs?id=$job" | jq -r '.job.status')
            if [ "$state" = completed ]; then exit 0; fi
            if [ "$state" = failed ]; then echo "Durable job failed; inspect job $job"; exit 1; fi
            sleep 10
          done
          echo "Durable job did not complete in time: $job"
          exit 1

          echo "Orders request accepted or completed. Follow progress and failures in /pipeline/live and the activity log."

  maintenance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'maintenance' || github.event.schedule == '17 4 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/maintenance${query}"

  daily:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'daily' || github.event.schedule == '20 5 * * *' }}
    runs-on: ubuntu-latest
    steps:
      # curl -f accepts HTTP 202; stage outcomes are tracked in the activity log.
      - name: Start daily chain (HTTP 202 accepted)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          response=$(curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/daily${query}")
          echo "$response"
          job=$(printf '%s' "$response" | jq -r '.jobId // empty')
          test -n "$job"
          for attempt in $(seq 1 30); do
            state=$(curl -fsS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/jobs?id=$job" | jq -r '.job.status')
            if [ "$state" = completed ]; then exit 0; fi
            if [ "$state" = failed ]; then echo "Durable job failed; inspect job $job"; exit 1; fi
            sleep 10
          done
          echo "Durable job did not complete in time: $job"
          exit 1

          echo "Daily request accepted or completed. Follow progress and failures in /pipeline/live and the activity log."

  health:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'health' || github.event.schedule == '0 9 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run health report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          query=""
          if [ "${FORCE:-}" = "true" ]; then
            query="?force=1"
          fi
          curl -fsS --connect-timeout 15 --max-time 300 -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/health${query}"
