            echo "Set repository secret CRON_SECRET to the same value as Railway. It is not stored in this workflow."
            exit 1
          fi
          url="${AUTOPILOT_URL:-https://etsy-autopilot-production-8b9f.up.railway.app}"
          url="${url%/}"
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "${url}/api/cron/listing"

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'publish' || github.event.schedule == '0 7 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run publish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
        run: |
          set -euo pipefail
